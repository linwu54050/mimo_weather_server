[project]
name = "mimo-weather-server"
version = "0.1.0"
description = "一个基于 MCP 协议的天气查询服务器"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.29.0",
    "requests==2.34.2"
]

[project.scripts]
weather-server = "weather_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"